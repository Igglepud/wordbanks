<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Spanish Word Banks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #7b2cbf;
            margin-bottom: 40px;
            font-size: 2.5em;
        }

        .module-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .module-card {
            background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
        }

        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(123, 44, 191, 0.6);
        }

        .module-card h2 {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .module-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Spanish Word Banks</h1>
        
        <div class="module-list">
            <a href="arverbs/elestres1-36/" class="module-card">
                <h2>AR Verbs</h2>
                <p>El Estrés 1-36</p>
            </a>
            
            <a href="elestres1-36/" class="module-card">
                <h2>El Estrés</h2>
                <p>Vocabulary 1-36</p>
            </a>
            
            <a href="estoyenfermo/" class="module-card">
                <h2>Estoy Enfermo</h2>
                <p>Health & Illness</p>
            </a>
            
            <a href="lafamilia/" class="module-card">
                <h2>La Familia</h2>
                <p>Family Vocabulary</p>
            </a>
            
            <a href="spanish1comoereswordbank1/" class="module-card">
                <h2>¿Cómo Eres?</h2>
                <p>Spanish 1 Descriptions</p>
            </a>
            
            <a href="spanish1lapersonalidad/" class="module-card">
                <h2>La Personalidad</h2>
                <p>Spanish 1 Personality</p>
            </a>
            
            <a href="spanish2rutinadiariawordbank1/" class="module-card">
                <h2>Rutina Diaria</h2>
                <p>Spanish 2 Daily Routine</p>
            </a>
        </div>
    </div>
</body>
</html>
